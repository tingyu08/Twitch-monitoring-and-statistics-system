name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # stream-metric-retention.pg.test.ts 要真的 PostgreSQL 才驗得到 SQL；沒有它會被略過
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      # 與正式環境的 Dockerfile（node:22）一致
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install backend dependencies
        run: npm ci --workspace backend --include-workspace-root
      - name: Generate Prisma client
        working-directory: backend
        run: npx prisma generate
      - name: Typecheck
        working-directory: backend
        run: npx tsc --noEmit -p tsconfig.json
      - name: Lint
        working-directory: backend
        run: npm run lint
      - name: Test
        working-directory: backend
        env:
          TEST_POSTGRES_URL: postgresql://postgres:test@localhost:5432/postgres
        run: npm test

  deploy-backend:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [backend]
    runs-on: ubuntu-latest
    timeout-minutes: 40 # VPS 端可能排在 StockwiseAI 的部署後面，再加建置時間
    concurrency:
      group: deploy-twitch-vps
      cancel-in-progress: false
    env:
      VPS_HOST: 43.153.138.225
      # 主機公鑰不是機密；寫死在這裡，主機被換掉時連線會直接失敗而不是誤連
      VPS_HOST_KEY: ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIAm6Dhi+IKA6ZvewA77kUEDGj0htx4Aq4bH/CNz/+Exn
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # 只改文件或前端時不必重啟後端（重啟會讓聊天機器人斷線、EventSub 重新訂閱）
      - name: Detect backend changes
        id: changes
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          if ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          elif git diff --quiet "$BEFORE" "$GITHUB_SHA" -- backend Dockerfile .dockerignore deploy/vps; then
            echo "backend/、Dockerfile、deploy/vps/ 沒有變更，略過部署"
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Deploy to VPS
        if: steps.changes.outputs.deploy == 'true'
        env:
          DEPLOY_KEY: ${{ secrets.VPS_DEPLOY_KEY }}
        run: |
          if [ -z "$DEPLOY_KEY" ]; then
            echo "::error::未設定 repo secret VPS_DEPLOY_KEY，無法部署"
            exit 1
          fi
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          echo "$VPS_HOST $VPS_HOST_KEY" > ~/.ssh/known_hosts
          echo "$GITHUB_SHA" > REVISION
          # 這把金鑰在 VPS 上被 forced command 綁死，只能把 tar 交給 deploy_entry.sh，
          # 不能執行任意指令。backend/exports 是觀眾個資匯出檔，不送上去
          git archive --format=tar --add-file=REVISION HEAD \
              Dockerfile .dockerignore backend deploy/vps ':(exclude)backend/exports' \
            | ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes ubuntu@"$VPS_HOST"
