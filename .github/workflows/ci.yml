name: CI

on:
  push:
    branches: [main]
  pull_request:
  # 手動重新部署：Actions → CI → Run workflow（main）
  workflow_dispatch:

permissions:
  contents: read
  # 變更偵測要查過去的 run 是否真的部署過
  actions: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # stream-metric-retention.pg.test.ts 要真的 PostgreSQL 才驗得到 SQL；沒有它會被略過
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      # 與正式環境的 Dockerfile（FROM node:22，每次 build 拿最新的 22.x）一致。
      # 不加 check-latest 會用 runner 預先快取的 22.x，不一定是正式環境實際跑的版本
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          check-latest: true
          cache: npm
      # log 要登入才看得到，版本號寫成 notice 才能從 API 讀到
      - name: Report Node version
        run: echo "::notice title=Node version::$(node -v)"
      - name: Install backend dependencies
        run: npm ci --workspace backend --include-workspace-root
      - name: Generate Prisma client
        working-directory: backend
        run: npx prisma generate
      - name: Typecheck
        working-directory: backend
        run: npx tsc --noEmit -p tsconfig.json
      - name: Lint
        working-directory: backend
        run: npm run lint
      # github-actions reporter 把失敗的測試寫成 annotation：公開 repo 的 log 要登入才看得到，
      # annotation 則任何人都能從 API 讀到
      - name: Test
        working-directory: backend
        env:
          # 用 127.0.0.1 而非 localhost：Node 17+ 可能先解析成 ::1，service container 未必綁 IPv6
          TEST_POSTGRES_URL: postgresql://postgres:test@127.0.0.1:5432/postgres
        run: npm test -- --reporters=default --reporters=github-actions

  deploy-backend:
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    needs: [backend]
    runs-on: ubuntu-latest
    timeout-minutes: 40 # VPS 端可能排在 StockwiseAI 的部署後面，再加建置時間
    concurrency:
      group: deploy-twitch-vps
      cancel-in-progress: false
    env:
      VPS_HOST: 43.153.138.225
      # 主機公鑰不是機密；寫死在這裡，主機被換掉時連線會直接失敗而不是誤連
      VPS_HOST_KEY: ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIAm6Dhi+IKA6ZvewA77kUEDGj0htx4Aq4bH/CNz/+Exn
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # 只改文件或前端時不必重啟後端（重啟會讓聊天機器人斷線、EventSub 重新訂閱）。
      # 比較基準是「上一次真的部署成功的版本」，不是上一次 push：CI 失敗的 push 不會部署，
      # 若只跟上一次 push 比，那些 push 裡的後端變更在下一次只改文件的 push 時會被當成
      # 「沒變更」而永遠不上線（1e1be94 就是這樣：CI 綠了卻什麼都沒部署）
      - name: Detect backend changes
        id: changes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            echo "手動觸發，直接部署"
            echo "deploy=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          api="https://api.github.com/repos/$GITHUB_REPOSITORY"
          auth="Authorization: Bearer $GH_TOKEN"
          base=""
          runs=$(curl -fsSL -H "$auth" "$api/actions/workflows/ci.yml/runs?branch=main&status=success&per_page=30" \
            | jq -r '.workflow_runs[] | "\(.id) \(.head_sha)"') || runs=""
          while read -r run_id sha; do
            [ -n "$run_id" ] || continue
            deployed=$(curl -fsSL -H "$auth" "$api/actions/runs/$run_id/jobs" \
              | jq '[.jobs[] | select(.name == "deploy-backend") | .steps[]
                     | select(.name == "Deploy to VPS" and .conclusion == "success")] | length') || deployed=0
            if [ "${deployed:-0}" -gt 0 ]; then
              base=$sha
              break
            fi
          done <<EOF
          $runs
          EOF
          if [ -z "$base" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            echo "找不到上一次成功部署的版本，部署"
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          elif git diff --quiet "$base" "$GITHUB_SHA" -- backend Dockerfile .dockerignore deploy/vps; then
            echo "自上次部署（$base）以來 backend/、Dockerfile、deploy/vps/ 沒有變更，略過部署"
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          else
            echo "自上次部署（$base）以來有後端變更，部署"
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Deploy to VPS
        if: steps.changes.outputs.deploy == 'true'
        env:
          DEPLOY_KEY: ${{ secrets.VPS_DEPLOY_KEY }}
        run: |
          if [ -z "$DEPLOY_KEY" ]; then
            echo "::error::未設定 repo secret VPS_DEPLOY_KEY，無法部署"
            exit 1
          fi
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          echo "$VPS_HOST $VPS_HOST_KEY" > ~/.ssh/known_hosts
          echo "$GITHUB_SHA" > REVISION
          # 這把金鑰在 VPS 上被 forced command 綁死，只能把 tar 交給 deploy_entry.sh，
          # 不能執行任意指令。backend/exports 是觀眾個資匯出檔，不送上去
          git archive --format=tar --add-file=REVISION HEAD \
              Dockerfile .dockerignore backend deploy/vps ':(exclude)backend/exports' \
            | ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes ubuntu@"$VPS_HOST"
